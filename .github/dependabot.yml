version: 2
updates:
  # target-branch: "dev" so dependency updates land on dev and go through staging first,
  # like every other change (main is production-only - see CLAUDE.md). Without this,
  # Dependabot defaults to the repo's default branch (main) and would push updates straight
  # to prod, bypassing the staging soak.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Base images (#566 bullet 3): the Dockerfile's FROM lines (node, mediamtx) were never watched, so a
  # new base tag or digest arrived only when someone remembered. Dependabot proposes tag bumps; it does
  # not pin digests (the Dockerfile still uses floating tags - see the PR for that open question).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # Node 24 is the only version tested (CLAUDE.md, .nvmrc, node-version-pin.test.js); a bump to the next
      # major is a deliberate change across five places, not a Dependabot PR. Patch/minor still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Watches for known vulnerabilities and available updates in the actual app
  # dependencies - the ongoing, automatic equivalent of periodically running
  # `npm audit` yourself.
  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # No committed E2E lock: it is a per-run artefact (see playwright/.gitignore).
  # Dependabot bumps the manifest only. Bump the Playwright image tag in the same
  # PR; dependency-hygiene.test.js keeps the PR red until the versions match.
  - package-ecosystem: "npm"
    directory: "/e2e/playwright"
    target-branch: "dev"
    schedule:
      interval: "weekly"
