version: 2
updates:
  # target-branch: "dev" so dependency updates land on dev and go through staging first,
  # like every other change (main is production-only - see CLAUDE.md). Without this,
  # Dependabot defaults to the repo's default branch (main) and would push updates straight
  # to prod, bypassing the staging soak.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Base images (#566 bullet 3): the Dockerfile's FROM lines (node, mediamtx) were never watched, so a
  # new base tag or digest arrived only when someone remembered. Dependabot proposes tag bumps; it does
  # not pin digests (the Dockerfile still uses floating tags - see the PR for that open question).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # #751 SOAK: Node 24 stays supported in .nvmrc, engines and CI while the Docker image runs 26.
      # A support-major bump is deliberate after the soak, not a Dependabot PR; keep this ignore.
      # The node-next.yml preview is not a support statement. Patch/minor updates still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Watches for known vulnerabilities and available updates in the actual app
  # dependencies - the ongoing, automatic equivalent of periodically running
  # `npm audit` yourself.
  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # WHY: onvif 1.0 is a rewrite (unwrapped responses, renamed active-profile properties, explicit close()), not a bump.
      # lib/onvif.js is built on the 0.x Cam class and works around cameras with minimal ONVIF servers (Thingino, Sonoff)
      # and drives PTZ, and no test talks to a real camera. The migration is a planned T2 change tested against a real
      # camera. Minor and patch updates of 0.x still come through.
      - dependency-name: "onvif"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # WHY: React 19 is the planned migration in planning/634-react19.md (#634), not a Dependabot PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # No committed E2E lock: it is a per-run artefact (see playwright/.gitignore).
  # Dependabot bumps the manifest only. Bump the Playwright image tag in the same
  # PR; dependency-hygiene.test.js keeps the PR red until the versions match.
  - package-ecosystem: "npm"
    directory: "/e2e/playwright"
    target-branch: "dev"
    schedule:
      interval: "weekly"
