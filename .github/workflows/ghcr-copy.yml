name: Copy published tags to ghcr.io

# Copies tags that are already on Docker Hub (sauso/nightlight) to the ghcr.io mirror (ghcr.io/sauso/nightlight),
# BY DIGEST, with the same script and the same rules as docker-publish.yml's mirror-ghcr job
# (scripts/ghcr-mirror.sh). For two cases: tags published before the mirror existed (the backfill), and a
# mirror that failed. docs/operations.md, "Registries".
#   gh workflow run ghcr-copy.yml --ref dev -f tags="0.49.0 latest"
# A release tag (X.Y.Z) that already exists on ghcr.io at a different digest is refused unless `force` is set:
# check which image is right first. Manual only: no push, schedule or pull_request trigger.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags to copy, separated by spaces or commas: latest, dev, X.Y, X.Y.Z or a short sha'
        type: string
        required: true
      force:
        description: 'Let an existing X.Y.Z tag on ghcr.io move to the digest Docker Hub serves now'
        type: boolean
        default: false

# Least privilege: the default token only reads the repository; the one job below adds packages: write.
permissions:
  contents: read

# The SAME group as weekly-rebuild.yml: this copies whatever Docker Hub's tag serves when it runs, and a rebuild may
# be promoting that very tag, so one waits for the other instead of racing it. cancel-in-progress: false, so neither
# cancels a running promotion or copy. GitHub keeps only ONE pending run per group: a dispatch queued while another
# run is already waiting replaces the waiting one, so dispatch again if a copy shows as cancelled.
concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job here, and the only one that can write packages: GITHUB_TOKEN pushes to ghcr.io.
    permissions:
      contents: read
      packages: write
    env:
      SRC_REPO: sauso/nightlight
      DST_REPO: ghcr.io/sauso/nightlight
    steps:
      - name: Check out the mirror script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs git credentials, so the token (which can write packages) is not left in .git/config.
          persist-credentials: false

      # Before logging in anywhere: a bad tag stops the run here. The input arrives only through env (never
      # ${{ }} inside run), and the script's --check is the one allowlist, shared with every other caller; it
      # prints the tags bare, one per line.
      - name: Check the tags
        id: tags
        env:
          TAGS_INPUT: ${{ inputs.tags }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          export TAGS="${TAGS_INPUT//,/ }"
          LIST=$(sh scripts/ghcr-mirror.sh --check)
          echo "tags=$(printf '%s' "$LIST" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (for imagetools)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Read-only use: anonymous Docker Hub reads are rate-limited per IP, and runner IPs are shared.
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each tag is read on Docker Hub ONCE and copied from that digest, never from the tag, so what is copied is
      # exactly what the log names even if Docker Hub's tag moves meanwhile. The script logs what the ghcr.io tag
      # pointed at before (or refuses, printing both digests). Every tag is tried; the first failure's code is
      # the step's.
      - name: Copy each tag by its Docker Hub digest
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          set -f
          RC=0
          for tag in $TAGS; do
            if ! DIGEST=$(docker buildx imagetools inspect "$SRC_REPO:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"'); then
              echo "::error::could not read $SRC_REPO:$tag on Docker Hub, so it was not copied"
              [ "$RC" -ne 0 ] || RC=1
              continue
            fi
            echo "Docker Hub $SRC_REPO:$tag is $DIGEST"
            DIGEST="$DIGEST" TAGS="$tag" sh scripts/ghcr-mirror.sh || { s=$?; [ "$RC" -ne 0 ] || RC=$s; }
          done
          exit "$RC"
