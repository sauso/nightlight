name: Tests and checks

# Fast unit + integration tests (Node's built-in runner, no services) plus cheap static checks. Cheap
# enough to run on every push and every PR, unlike e2e.yml which spins up containers and a browser.
#
# Separate jobs on purpose:
#   * `unit`  — everything must pass. A red suite blocks the merge.
#   * `changelog` — CHANGELOG.md structure. Duplicate `### Added` blocks are invisible in a PR diff
#     (each looks like a correct single addition on its own) and only show up when someone reads the
#     whole rendered section, which nobody does every time. It happened across #179-#186.
#   * `core-coverage` — the CORE-LOGIC COVERAGE GATE. Nightlight's rule is that core logic stays at
#     >= 95% line coverage, and that this is checked BEFORE code is promoted to production. Enforcing
#     it here rather than in a checklist means it can't be forgotten during a release.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run the test suite
        working-directory: backend
        run: npm test

  core-coverage:
    name: Core-logic coverage gate (>= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      # Exits non-zero if the modules listed in the `test:core` script fall below the thresholds.
      # The include list in backend/package.json IS the definition of "core logic" — extend it as
      # each further module reaches the bar.
      - name: Enforce core-logic coverage thresholds
        working-directory: backend
        run: npm run test:core

  frontend:
    name: Front-end component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci
      - name: Run component tests
        working-directory: frontend
        run: npm test
      # NOTE: the >= 80% front-end coverage threshold is configured in vite.config.js but is NOT a
      # blocking gate yet - the suite is at the very start of Phase 5 and would fail every run, which
      # would train everyone to ignore it. Promote this to `npm run test:coverage` once the target is
      # actually met, the same way the backend core-logic gate was only switched on once it passed.

  changelog:
    name: CHANGELOG structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No dependencies and no install step - it reads one file. Checks structure only: one heading
      # per type per version, Keep a Changelog order, released sections dated, no version listed
      # twice. It has no opinion about wording and never rewrites the file.
      - name: Check CHANGELOG.md structure
        run: node scripts/check-changelog.mjs

  definition-of-done:
    name: Docs + tests reminder
    # PRs only: it compares against the base branch, and on a plain push there is nothing meaningful
    # to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Deliberately a WARNING, never a failure. It cannot tell a feature from a refactor, so it will
      # sometimes be wrong — and a check that cries wolf is one people learn to click past, which is
      # worse than no check at all. It exists to make "I'll document it later" a visible decision
      # rather than an invisible one. The real gates are the human ones in CLAUDE.md and the release
      # skill; this is just the nudge at the moment it's cheapest to act on.
      - name: Check that behaviour changes bring docs and tests
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED" | sed 's/^/  /'

          has() { echo "$CHANGED" | grep -qE "$1"; }

          # Did this PR change what the app DOES? Test files and stories don't count as behaviour.
          BEHAVIOUR=$(echo "$CHANGED" | grep -E '^(backend/src/|frontend/src/)' | grep -vE '/test/' || true)
          [ -z "$BEHAVIOUR" ] && { echo "No behaviour change — nothing to remind about."; exit 0; }

          if ! has '^(backend/test/|frontend/test/)'; then
            echo "::warning::This PR changes backend/src or frontend/src but adds no tests. New behaviour needs a test; a fix needs a regression test you have watched fail without the fix. If that genuinely doesn't apply here, say why in the PR."
          fi

          # A changelog entry means a user can see the change — so a user can probably also read about it.
          if has '^CHANGELOG\.md' && ! has '^(docs/|README\.md)'; then
            echo "::warning::This PR adds a changelog entry (so a user will notice it) but touches no docs. A new setting needs its default and range; behaviour that differs from its neighbours needs that difference stated. See the Definition of done in CLAUDE.md."
          fi

          # A settings column almost always implies a documented setting.
          if git diff "$BASE"...HEAD -- backend/src/db.js | grep -q 'ALTER TABLE settings ADD COLUMN'; then
            if ! has '^(docs/|README\.md)'; then
              echo "::warning::This PR adds a settings column but changes no docs. Every user-facing setting is documented with its default and its range."
            fi
          fi
          echo "Reminder check complete (warnings above, if any, do not fail the build)."

