name: Tests and checks

# Fast unit + integration tests (Node's built-in runner, no services) plus cheap static checks. Cheap
# enough to run on every push and every PR, unlike e2e.yml which spins up containers and a browser.
#
# Separate jobs on purpose:
#   * `unit`  — everything must pass, and the core-logic coverage gate (>= 95% lines) is enforced by the same run
#     (#754: the gate used to be a second job running the suite again). A red suite or thin coverage blocks the merge.
#   * `changelog` — CHANGELOG.md structure. Duplicate `### Added` blocks are invisible in a PR diff
#     (each looks like a correct single addition on its own) and only show up when someone reads the
#     whole rendered section, which nobody does every time. It happened across #179-#186.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch: {}

# Least privilege (#566 bullet 5): this workflow only reads the repository, so the token it is handed is
# limited to that instead of the repository default (which may include write).
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      # ONE run of the whole backend suite, with coverage on and the thresholds enforced (#754). `test:core` is
      # `node --test … test/*.test.js` plus the coverage flags, so it runs exactly the files `npm test` runs and exits
      # non-zero for a failing test OR for coverage under 95% lines / 90% functions / 80% branches over the include list in
      # backend/package.json (which IS the definition of "core logic": grow it as modules qualify, never shrink it to go
      # green). It used to be two jobs, `unit` (plain) and `core-coverage`, running the same files twice.
      - name: Run the test suite with the core-logic coverage gate
        working-directory: backend
        run: npm run test:core
      # #549: entrypoint.sh's file-mode block is shell, so neither the JS mutation catalogue nor a Windows dev
      # machine can exercise it (entrypoint-umask.test.js is skipped where there are no POSIX modes). This step is
      # where it gets its evidence:
      #   1. the same test inside node:24-alpine, the image's own base, as its unprivileged `node` user: BusyBox sh,
      #      find, stat and chmod are what production runs (`npm test` above used Ubuntu's dash and GNU tools).
      #      A run that skipped anything proves nothing, hence the check on the TAP summary;
      #   2. scripts/entrypoint-umask.mutants.sh: every named mutation of the block must turn the test red.
      #   3. entrypoint-chown.test.js (#567) as ROOT in the same image (post-merge review of PR #701): its "a file
      #      owned by someone else" cases need root to create such a file, so `npm test` above (the unprivileged
      #      `runner` user) SKIPS them. Here they run, under BusyBox stat, and a skip fails the step. Root inside a
      #      throwaway container only: the job's token permissions are unchanged.
      #   4. (#553) entrypoint-media-isolation.test.js, the media isolation decision, in the unprivileged run with the
      #      umask test (BusyBox sh is what production runs it on); and entrypoint-media-isolation-real.test.js as
      #      ROOT with util-linux's setpriv installed (`apk add setpriv`, as the Dockerfile does): the real drops, the
      #      real probe. `npm test` above skips that file (not root), so a skip here fails the step.
      - name: Entrypoint file modes and ownership on BusyBox, and the shell mutants (#549, #567)
        run: |
          docker run --rm --user node -v "$PWD/backend:/w:ro" -w /w node:24-alpine \
            node --test --test-reporter=tap test/entrypoint-umask.test.js test/entrypoint-media-isolation.test.js > "$RUNNER_TEMP/busybox.tap" \
            || { cat "$RUNNER_TEMP/busybox.tap"; exit 1; }
          grep -q '^# skipped 0$' "$RUNNER_TEMP/busybox.tap" \
            || { cat "$RUNNER_TEMP/busybox.tap"; echo "::error::the BusyBox run skipped tests"; exit 1; }
          tail -9 "$RUNNER_TEMP/busybox.tap"
          docker run --rm --user root -v "$PWD/backend:/w:ro" -w /w node:24-alpine \
            node --test --test-reporter=tap test/entrypoint-chown.test.js > "$RUNNER_TEMP/busybox-chown.tap" \
            || { cat "$RUNNER_TEMP/busybox-chown.tap"; exit 1; }
          grep -q '^# skipped 0$' "$RUNNER_TEMP/busybox-chown.tap" \
            || { cat "$RUNNER_TEMP/busybox-chown.tap"; echo "::error::the BusyBox chown run (as root) skipped tests"; exit 1; }
          tail -9 "$RUNNER_TEMP/busybox-chown.tap"
          docker run --rm --user root -v "$PWD/backend:/w:ro" -w /w node:24-alpine \
            sh -c 'apk add --no-cache setpriv >/dev/null && node --test --test-reporter=tap test/entrypoint-media-isolation-real.test.js' \
            > "$RUNNER_TEMP/busybox-media.tap" \
            || { cat "$RUNNER_TEMP/busybox-media.tap"; exit 1; }
          grep -q '^# skipped 0$' "$RUNNER_TEMP/busybox-media.tap" \
            || { cat "$RUNNER_TEMP/busybox-media.tap"; echo "::error::the media isolation run (as root) skipped tests"; exit 1; }
          tail -9 "$RUNNER_TEMP/busybox-media.tap"
          bash scripts/entrypoint-umask.mutants.sh

  frontend:
    name: Front-end component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci
      # NOW A BLOCKING GATE. The >= 80% threshold lives in vite.config.js and this runs it, on the
      # same principle the backend core-logic gate was switched on: only once the suite actually
      # passes it, so it never trains anyone to click past a red check. Met 2026-09-02 at
      # 87.5 statements / 82.9 branches / 80.8 functions / 90.2 lines, measured on the front end
      # that CAN be tested (see the exclude list in vite.config.js, where every entry has to
      # justify itself).
      #
      # /!\ THE FUNCTION PERCENTAGE IS NOT DETERMINISTIC. Three runs of the same tree on the same
      # machine gave 80.71 / 80.59 / 80.59 - about 0.12 of a point, one or two functions out of ~810.
      # So the target is not "clear 80", it is "clear 80 by more than the noise": the first attempt
      # cleared it by 0.09 locally and went red here. If this job is red while a dev machine is
      # green, re-measure on a CLEAN checkout before concluding anything about the runner - an
      # earlier note here blamed the runner, and a clean local checkout of that same commit
      # reproduced the failing number exactly.
      # Raise the coverage, never lower the threshold or widen the exclude list, which is the same
      # thing wearing a different hat.
      - name: Run component tests + coverage gate
        working-directory: frontend
        run: npm run test:coverage

  changelog:
    name: CHANGELOG structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No dependencies and no install step - it reads one file. Checks structure only: one heading
      # per type per version, Keep a Changelog order, released sections dated, no version listed
      # twice. It has no opinion about wording and never rewrites the file.
      - name: Check CHANGELOG.md structure
        run: node scripts/check-changelog.mjs

  definition-of-done:
    name: Docs + tests reminder
    # PRs only: it compares against the base branch, and on a plain push there is nothing meaningful
    # to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Deliberately a WARNING, never a failure. It cannot tell a feature from a refactor, so it will
      # sometimes be wrong — and a check that cries wolf is one people learn to click past, which is
      # worse than no check at all. It exists to make "I'll document it later" a visible decision
      # rather than an invisible one. The real gates are the human ones in CLAUDE.md and the release
      # skill; this is just the nudge at the moment it's cheapest to act on.
      - name: Check that behaviour changes bring docs and tests
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED" | sed 's/^/  /'

          has() { echo "$CHANGED" | grep -qE "$1"; }

          # Did this PR change what the app DOES? Test files and stories don't count as behaviour.
          BEHAVIOUR=$(echo "$CHANGED" | grep -E '^(backend/src/|frontend/src/)' | grep -vE '/test/' || true)
          [ -z "$BEHAVIOUR" ] && { echo "No behaviour change — nothing to remind about."; exit 0; }

          if ! has '^(backend/test/|frontend/test/)'; then
            echo "::warning::This PR changes backend/src or frontend/src but adds no tests. New behaviour needs a test; a fix needs a regression test you have watched fail without the fix. If that genuinely doesn't apply here, say why in the PR."
          fi

          # A changelog entry means a user can see the change — so a user can probably also read about it.
          if has '^CHANGELOG\.md' && ! has '^(docs/|README\.md)'; then
            echo "::warning::This PR adds a changelog entry (so a user will notice it) but touches no docs. A new setting needs its default and range; behaviour that differs from its neighbours needs that difference stated. See the Definition of done in CLAUDE.md."
          fi

          # A settings column almost always implies a documented setting.
          if git diff "$BASE"...HEAD -- backend/src/db.js | grep -q 'ALTER TABLE settings ADD COLUMN'; then
            if ! has '^(docs/|README\.md)'; then
              echo "::warning::This PR adds a settings column but changes no docs. Every user-facing setting is documented with its default and its range."
            fi
          fi
          echo "Reminder check complete (warnings above, if any, do not fail the build)."

