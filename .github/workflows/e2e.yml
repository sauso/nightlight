name: End-to-end tests

# Runs the e2e/ stack (real app image + synthetic RTSP camera) on a GitHub Linux
# runner. Deliberately NOT on every push — the stack spins up containers + a fake
# camera + a browser, so it's minutes, not seconds. Per the scope doc's Phase 0
# decision it runs where it earns its cost:
#   - on a dev -> main PR   : gates the production release
#   - nightly on dev        : catches drift between releases
#   - manual (dispatch)     : on demand
#
# The stack always runs an image built from the checked-out commit (Phase 4), never a published tag.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 15 * * *' # 15:00 UTC nightly
  workflow_dispatch: {}

# Least privilege (#566 bullet 5): this workflow only reads the repository, so the token it is handed is
# limited to that instead of the repository default (which may include write).
permissions:
  contents: read

# Don't pile up runs; a newer commit on the same PR/branch supersedes an in-flight one.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A nightly (schedule) run fires from the default branch — point it at dev,
          # the branch we actually want covered between releases. PR/dispatch use their
          # own triggering ref.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      # Phase 4: build the app image from THIS commit and tag it as the one the compose stack
      # references. Without this the suite tests whatever `sauso/nightlight:dev` currently points at,
      # which is a real race: on a dev -> main PR that tag is the PREVIOUS dev build until the publish
      # workflow finishes, so a green e2e run could be proving the wrong code. Building here also means
      # a PR is tested before its image is published at all.
      #
      # Local runs need the same step — `bash e2e/test.sh` alone will silently exercise the last
      # published image, not your working tree.
      - name: Phase 4 — build the app image from this commit
        run: docker build -t sauso/nightlight:dev .

      - name: Record which image the stack will run
        run: |
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect sauso/nightlight:dev --format 'image id: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"

      # Phase 1: the whole pipeline (transcoder -> MediaMTX -> HLS) delivers playable
      # frames from the synthetic camera. Self-contained: brings the stack up and tears
      # it back down. Gate for Phase 2 — no point driving the UI if the pipeline is dead.
      - name: Phase 1 — pipeline prove-out
        working-directory: e2e
        run: bash prove.sh

      # Phase 2: the Playwright UI suite (first-run, add camera -> live tile, audio
      # toggle, settings) against a fresh stack. The Playwright report + traces are
      # written to the mounted host dir, so they survive the stack teardown.
      - name: Phase 2 — Playwright UI suite
        working-directory: e2e
        run: bash test.sh

      # Render a pass/fail table on the Actions run page, so results are visible at a
      # glance without downloading the report artifact.
      - name: Test summary
        if: always()
        run: node e2e/playwright/summarize.mjs e2e/playwright/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright/playwright-report
            e2e/playwright/test-results
          if-no-files-found: ignore

      # Documentation screenshots (from 05-screenshots.spec.js). Download this artifact
      # and commit the images under docs/screenshots/ to refresh the docs — see e2e/README.md.
      - name: Upload documentation screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots
          path: e2e/playwright/screenshots
          if-no-files-found: ignore

      - name: Tear down (safety net)
        if: always()
        working-directory: e2e
        run: docker compose -f docker-compose.e2e.yml -p nightlight-e2e --profile test down -v || true

  # #553 part b: the OPTIONAL container hardening (docs/operations.md, "Hardening the container (optional)"),
  # proven against an image built from this commit. e2e/hardened.sh checks that the hardened container works
  # (green), and that leaving out KILL, DAC_OVERRIDE or FOWNER breaks it the way the docs say (three negative
  # controls, each failing the job if its failure does not show). A job of its own, not a step after Playwright,
  # so a Playwright failure cannot skip it; its own containers, network, volumes and host port (4100), so it never
  # meets the stack above. It reads the containers' processes from this runner's /proc, which needs a Linux host.
  hardened:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same rule as the e2e job: a nightly run covers dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      # Same reason as the e2e job's Phase 4 step: test this commit, never a published tag.
      - name: Build the app image from this commit
        run: docker build -t sauso/nightlight:dev .

      - name: Record which image the run uses
        run: |
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect sauso/nightlight:dev --format 'image id: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Hardened container (green run, then the K, D and F controls)
        env:
          HARDENED_LOG_DIR: ${{ runner.temp }}/hardened-logs
        run: bash e2e/hardened.sh all

      # Every container's full log, to compare a run with the expectations at the top of e2e/hardened.sh.
      - name: Upload the hardened run's container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardened-logs
          path: ${{ runner.temp }}/hardened-logs
          if-no-files-found: ignore

      - name: Tear down (safety net)
        if: always()
        run: bash e2e/hardened.sh teardown || true

  # #553 phase 1: media isolation (ffmpeg, ffprobe and MediaMTX as a separate user), behind the internal switch
  # NIGHTLIGHT_MEDIA_ISOLATION=1, proven against an image built from this commit. e2e/media-isolation.sh checks the
  # "on" start under the six-capability hardening and under Docker's defaults, and two fallbacks that must start the
  # usual way and report "off" (KILL missing, PUID=1700), each failing the job if its signature does not show. A job of
  # its own, like `hardened`: its own containers, network, volumes and host port (4200), and it reads the containers'
  # processes from this runner's /proc, which needs a Linux host.
  # #553 phase 2b: the "on" cases also prove the folder layout as the media user (docker exec -u 1700) and serve real
  # recordings with Range requests, and a negative control (the switch not set) runs in the same job; the time limit is
  # longer for the recordings those make.
  media-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same rule as the e2e job: a nightly run covers dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      # Same reason as the e2e job's Phase 4 step: test this commit, never a published tag.
      - name: Build the app image from this commit
        run: docker build -t sauso/nightlight:dev .

      - name: Record which image the run uses
        run: |
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect sauso/nightlight:dev --format 'image id: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Media isolation (on under the hardening and the defaults, the negative control, then the KILL and PUID fallbacks)
        env:
          MEDIA_ISO_LOG_DIR: ${{ runner.temp }}/media-isolation-logs
        run: bash e2e/media-isolation.sh all

      - name: Upload the media isolation run's container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: media-isolation-logs
          path: ${{ runner.temp }}/media-isolation-logs
          if-no-files-found: ignore

      - name: Tear down (safety net)
        if: always()
        run: bash e2e/media-isolation.sh teardown || true

  # #553 phase 2a: the one-way move of the database and secrets into DATA_DIR/private/, on an install made by the LAST
  # RELEASE (pulled from Docker Hub), upgraded to an image built from this commit: the move itself (a database with a
  # non-empty -wal, a root-owned Firebase file and backup, the snapshot folders), the old session and password still
  # working, a second start doing nothing, the documented rollback starting empty, the "two copies" case after it,
  # PUID=0, and console scripts on an empty volume creating nothing. A job of its own, like `hardened`: its own
  # containers, network, volumes and host port (4300).
  private-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Same rule as the e2e job: a nightly run covers dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      # Same reason as the e2e job's Phase 4 step: test this commit, never a published tag.
      - name: Build the app image from this commit
        run: docker build -t sauso/nightlight:dev .

      - name: Record which image the run uses
        run: |
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect sauso/nightlight:dev --format 'image id: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Private layout (upgrade from the last release, rollback, two copies, PUID=0, empty volume)
        env:
          PRIVATE_LAYOUT_LOG_DIR: ${{ runner.temp }}/private-layout-logs
        run: bash e2e/private-layout.sh all

      - name: Upload the private layout run's container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-layout-logs
          path: ${{ runner.temp }}/private-layout-logs
          if-no-files-found: ignore

      - name: Tear down (safety net)
        if: always()
        run: bash e2e/private-layout.sh teardown || true
