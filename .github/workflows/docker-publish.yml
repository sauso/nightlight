name: Build and publish Docker image

# Dev pushes publish :dev immediately. Main and v* tag publishes wait for the
# newest main-push test run of the same commit to pass; gate_only checks the gate
# without publishing an image.
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gate_only:
        description: Check the publish gate without pushing an image
        type: boolean
        default: false

# Least privilege (#566 bullet 5): this workflow only reads the repository (the Docker Hub push uses its own secrets, not this token), so the token it is handed is
# limited to that instead of the repository default (which may include write).
permissions:
  contents: read

# A release pushes a commit to main AND a v* tag - two push events, two runs of
# identical code. The tag run's published tags are a superset of the branch run's
# (latest + sha + semver vs latest + sha), so keying concurrency on the commit lets
# the tag run cancel the redundant branch run instead of building twice.
concurrency:
  group: docker-publish-${{ github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.gate_only }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out gate script
        uses: actions/checkout@v4
      - name: Wait for a green push test run of this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
          # The branch whose push test run is required. A main push or a v* tag build waits for the run
          # that tested the commit on main; a manual dispatch (the gate_only dry run from dev) waits for the
          # run on the branch it was dispatched on, so the dry run can pass without a release (Codex review of
          # the first build: the dev dry run would otherwise wait for a main run that never exists).
          GATE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
        run: sh scripts/publish-gate.sh

  build-and-push:
    needs: gate
    # A dev push skips gate. Explicitly accepting skipped, with !cancelled(),
    # overrides needs' default success-only behaviour; a failed gate still blocks.
    # gate_only always skips the publish, even after a successful gate check.
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && !inputs.gate_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for building arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sauso/nightlight
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build metadata
        id: bmeta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ steps.bmeta.outputs.date }}
          # SBOM and provenance attestations (#566 bullet 4), attached to the image in the registry: what is in
          # the image, and which workflow run built it from which commit. Free with build-push-action; the image is
          # publicly distributed. mode=max records the build arguments too (none are secret: GIT_SHA, GIT_REF,
          # BUILD_TIME). Side effect to know about: each tag becomes an index that also lists the attestation
          # manifests, shown as "unknown/unknown" by registry UIs; `docker pull` ignores them.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
