# End-to-end test stack: the real Nightlight image + a synthetic RTSP camera.
#
# This is test infrastructure, NOT part of the production deployment. It runs the
# real app image against a fake-but-real video/audio stream so the whole pipeline
# (transcoder -> MediaMTX -> WHEP/HLS) is exercised with no camera hardware.
#
# Unlike production (host networking, for WebRTC ICE), this uses a bridge network
# so the app can reach the synthetic camera by service name. That's fine for the
# HLS-based prove-out and for Playwright driving the UI; full WebRTC ICE from an
# external browser isn't the thing under test here.
#
#   docker compose -f docker-compose.e2e.yml up -d
#   ./prove.sh                       # Phase 1 gate: stream goes live end-to-end
#   docker compose -f docker-compose.e2e.yml down -v

name: nightlight-e2e

services:
  # Synthetic camera — see fakecam/mediamtx.yml.
  fakecam:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    volumes:
      - ./fakecam/mediamtx.yml:/mediamtx.yml:ro

  # The real app, staging image. Data is ephemeral (tmpfs) so every run is a
  # clean first-run: no seeded DB, the tests drive the real create-admin flow.
  nightlight:
    image: sauso/nightlight:dev
    depends_on:
      - fakecam
    environment:
      - TZ=UTC
      # Run the app as root inside the throwaway container so the tmpfs data dir
      # is writable without host uid/gid juggling — this container is disposable.
      - PUID=0
      - PGID=0
    ports:
      # Host port is overridable (E2E_PORT) so the stack can run on a box where
      # something else — e.g. a prod container on host networking — already holds
      # 4000. CI has no such conflict, so it defaults to 4000.
      - "${E2E_PORT:-4000}:4000"
    tmpfs:
      - /app/data
