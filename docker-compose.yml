services:
  nightlight:
    image: sauso/nightlight:latest
    # Uncomment to build from source instead of pulling from Docker Hub:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: nightlight
    restart: unless-stopped
    # How long Docker waits after SIGTERM before SIGKILL. Nightlight needs a few seconds to stop
    # cleanly: an in-flight recording is cut from the buffer during shutdown, and a SIGKILL loses it
    # (issue #256, then #279). The app's own worst case is bounded at 9s by design and a real stop
    # with a recording in flight measured ~4.6s, so 30s is generous on purpose — the container exits
    # as soon as it is done, so over-declaring costs nothing while under-declaring costs a recording.
    # ⚠️ Do NOT rely on Docker's default: Engine 29 no longer documents one, and a bare `docker stop`
    # measured ~4s on the machine this was found on — enough to kill the save half-finished.
    stop_grace_period: 30s
    # No `healthcheck:` here on purpose: the image defines one (GET /api/health on $PORT, 120s start
    # period), and a container inherits it. It only labels the container healthy/unhealthy
    # (`docker ps`, Unraid's Docker tab); nothing restarts an unhealthy container. See docs/operations.md.
    # Optional hardening (#553): drop every Linux capability except the six the start-up script needs, and
    # stop anything in the container gaining privileges again. Off by default. Tested in CI on bridge
    # networking only (e2e/hardened.sh), not yet with the host networking below: check your install as
    # docs/operations.md, "Hardening the container (optional)", describes. To roll back, comment the lines
    # out again and run `docker compose up -d`. The same six are listed in e2e/hardened.sh and that docs
    # section: change all three together.
    # cap_drop:
    #   - ALL
    # cap_add:
    #   # Root runs the start-up script, then hands the app to PUID:PGID. Each line: what needs it, and
    #   # what you see without it.
    #   - CHOWN          # re-owns the data directory to PUID:PGID; without it the container never starts
    #   - SETUID         # hands the app over to PUID; without it the container never starts
    #   - SETGID         # ...and to PGID and its groups; without it the container never starts
    #   - DAC_OVERRIDE   # lets root into the owner-only (700) data directory; without it the first start
    #                    # works, then a re-created container (an update) never starts, and `docker exec`
    #                    # commands such as the backup and the two-factor reset fail
    #   - FOWNER         # takes group/other access off existing files; without it the log warns "could
    #                    # not tighten" and the data directory keeps that access
    #   - KILL           # lets the container's init pass the stop signal on to the app; without it every
    #                    # stop or update kills the app instead, losing a recording in progress (silently)
    # security_opt:
    #   - no-new-privileges=true
    network_mode: host
    environment:
      # Which host user/group owns files this container creates in the data volume
      # (database, logs, MediaMTX config) - matters because Docker otherwise runs the
      # app as root, leaving everything root-owned and awkward to manage from outside
      # the container. Defaults to 99/100 - Unraid's own "nobody"/"users" convention.
      # Find your own with `id your_username` if you want something else.
      - PUID=${PUID:-99}
      # Which upstream addresses may set X-Forwarded-For. Blank = trust loopback only, which is
      # safe but means every visitor through a non-loopback reverse proxy looks like one client.
      # Only ever list an address you control - see docs/remote-access.md and .env.example.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # How many days a sign-in lasts, counted from sign-in (no idle sign-out). Range 7-30, blank = 30;
      # an invalid value logs a warning and 30 is used. A phone is signed out at the same time of day it
      # signed in and gets no Nightlight push alerts until it signs in again; lowering it signs out older
      # sign-ins at their next request. See .env.example and SECURITY.md.
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-}
      # Allow Cloudflare Web Analytics' beacon in the Content-Security-Policy: 1/true/yes/on = allow,
      # blank (the default) or 0/false/no/off = blocked; anything else is also blocked, with a warning.
      # Only for a site served through Cloudflare's proxy with Web Analytics on. See .env.example.
      - CLOUDFLARE_ANALYTICS=${CLOUDFLARE_ANALYTICS:-}
      - PGID=${PGID:-100}
      # Who else may read the data volume. 077 (the default) = owner only: the database holds every
      # stored secret in plaintext, and each start takes group/other access off existing files too.
      # Range 000-077 (3 or 4 octal digits, owner digit 0); an invalid value logs a warning and 077
      # is used. 022 = the old world-readable modes, for when another user/container reads the
      # volume: set it BEFORE upgrading, it only affects new files after one start at 077.
      # See docs/operations.md, "Who can read the data directory".
      - UMASK=${UMASK:-077}
      # Your local timezone (e.g. Australia/Melbourne) - affects log timestamps and the names of the video
      # buffer files only; the times the app shows follow Settings -> General.
      # Defaults to UTC if unset. Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=${TZ:-UTC}
      # Optional. A random, persistent secret is auto-generated and stored in the
      # data volume on first run if this is left unset - only set this yourself if
      # you specifically want a fixed value (e.g. shared across a migration).
      - JWT_SECRET=${JWT_SECRET:-}
      # Your public IP or DDNS hostname - only needed for Low Latency (WebRTC) mode
      # to work from outside your home network. Leave unset for LAN-only use.
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      # Optional. STUN servers for Low Latency (WebRTC), in the browser and in MediaMTX: a comma-separated
      # list of stun:host[:port]. Unset = Google's public server (below). BLANK = no STUN at all (nothing
      # contacts Google; viewing on your own network never needs STUN). Note `-` and not `:-`: a blank
      # value in .env must stay blank, not turn back into the default. See .env.example.
      - STUN_SERVERS=${STUN_SERVERS-stun:stun.l.google.com:19302}
      # Optional. The UDP port Low Latency (WebRTC) video uses - a bare number, 1-65535, blank =
      # 8189. Change it only to run a second instance on the same host. See .env.example.
      - WEBRTC_UDP_PORT=${WEBRTC_UDP_PORT:-}
      # Advanced override of the above, for a bind address a bare port cannot express (it WINS over
      # WEBRTC_UDP_PORT when both are set). No default on purpose: compose forwards a bare name only
      # when it is set, so an unset one never reaches MediaMTX as an empty string.
      - MTX_WEBRTCLOCALUDPADDRESS
      # Optional. Which port the app listens on - defaults to 4000 if unset. Under host
      # networking (below) this is also the port you reach it on. See .env.example.
      - PORT=${PORT:-}
      # Optional. Set this ONLY if you've mapped a "recordings" volume below to move
      # clips off the same disk as the database - see .env.example and the commented
      # volume line under `volumes:`. Leave unset to keep clips under /app/data.
      - CLIPS_DIR=${CLIPS_DIR:-}
    volumes:
      # Defaults to ./data next to this file. On Unraid, set APPDATA_DIR in .env to
      # something like /mnt/user/appdata/nightlight so it shows up in the Unraid UI/backups.
      - ${APPDATA_DIR:-./data}:/app/data
      # Optional - move event-recording clips onto separate/larger storage. Uncomment and
      # point at a host path, then set CLIPS_DIR above to the container-side path you use
      # here (e.g. /recordings). See .env.example.
      # The host folder must be writable by PUID/PGID, or clip recording is disabled; see docs/recording.md#where-recordings-are-stored.
      # - /path/to/recordings:/recordings
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
