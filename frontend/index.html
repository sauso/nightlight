<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no disable the browser/WebView's built-in pinch and
         double-tap PAGE zoom. This is a fixed-layout app (its own double-tap-to-zoom on a camera
         is a JS/CSS transform, unaffected by this), and leaving page zoom on caused a nasty
         Android bug: double-tapping the PiP window zoomed the whole app and left it stuck until
         restart. Not left scalable for accessibility because the app is not a scrollable document. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12172B" />
    <title>Nightlight — Baby Monitor</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS home screen support: lets "Add to Home Screen" launch full-screen, no browser chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nightlight" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
