<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- This LOCKED string is the default, and what the native app keeps. maximum-scale=1 +
         user-scalable=no disable the WebView's built-in pinch and double-tap PAGE zoom: this is a
         fixed-layout app (its own double-tap-to-zoom on a camera is a JS/CSS transform, unaffected
         by this), and leaving page zoom on in the Android app caused a nasty bug: double-tapping
         the PiP window zoomed the whole app and left it stuck until restart.
         In a BROWSER the app relaxes it at start (src/lib/viewport.js, called from App.jsx): it
         removes only those two tokens, so anyone who needs larger text can pinch-zoom (#562). The
         lock stays HERE, rather than being added by script for the native app, so that the native
         app is locked even if the script never runs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12172B" />
    <title>Nightlight — Baby Monitor</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS home screen support: lets "Add to Home Screen" launch full-screen, no browser chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nightlight" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
