# Docker Desktop uses a Linux VM. Publish only the authenticated web app and
# WebRTC media; MediaMTX's unauthenticated HTTP/API/RTSP listeners stay internal.
services:
  nightlight:
    image: sauso/nightlight:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "99"
      PGID: "100"
      TZ: UTC
      PORT: "4000"
      # The backend adds container interfaces itself. The Windows LAN address
      # must also be advertised, because those VM/container addresses are not
      # reachable from a phone. Loopback supports viewing on the PC itself.
      PUBLIC_HOST: "${NIGHTLIGHT_HOST:?Set NIGHTLIGHT_HOST to the Windows LAN IPv4 address},127.0.0.1"
      WEBRTC_UDP_PORT: "${NIGHTLIGHT_WEBRTC_PORT:-8189}"
      # This setup is for the home network. No public STUN service is needed.
      STUN_SERVERS: ""
    ports:
      - "${NIGHTLIGHT_HTTP_PORT:-4000}:4000/tcp"
      # The published port must match the ICE candidate's port exactly.
      - "${NIGHTLIGHT_WEBRTC_PORT:-8189}:${NIGHTLIGHT_WEBRTC_PORT:-8189}/udp"
    volumes:
      - data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# A Linux-backed named volume keeps SQLite off a Windows bind mount, preserves
# POSIX permissions, and survives stop, update and uninstall (never down -v).
volumes:
  data:
